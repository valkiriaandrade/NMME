[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nmme-maps"
version = "0.3.0"
description = "NMME / CFSv2 seasonal forecast maps of Brazil: monthly precipitation, temperature and anomalies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valkiria Andrade" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "xarray>=2023.1,<2027",
    "h5netcdf>=1.3,<2",
    "h5py>=3.9,<4",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "cartopy>=0.22,<1",
    "geopandas>=0.14,<2",
    "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "pre-commit>=3.5,<5",
]

[project.scripts]
nmme-maps = "nmme_maps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules"

[tool.coverage.run]
source = ["nmme_maps"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
